name: Vanta APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: Kaynak ZIP’ini aç
        shell: bash
        run: |
          archive=$(find . -maxdepth 1 -type f -name 'vanta-v*.zip' -print | sort -V | tail -n 1)
          if [[ -z "$archive" ]]; then
            echo "Deponun köküne vanta-v2.zip dosyasını yükle."
            exit 1
          fi
          echo "Kullanılan kaynak: $archive"
          mkdir .vanta-build-source
          unzip -q "$archive" -d .vanta-build-source
          test -f .vanta-build-source/settings.gradle
          test -d .vanta-build-source/app

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK 35
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Türkçe Vosk modelini indir
        working-directory: .vanta-build-source
        run: bash scripts/fetch-model.sh

      - name: APK’yı derle
        working-directory: .vanta-build-source
        run: |
          bash ./gradlew --no-daemon assembleDebug
          cp app/build/outputs/apk/debug/app-debug.apk ../Vanta.apk

      - name: Vanta-APK çıktısını yükle
        uses: actions/upload-artifact@v4
        with:
          name: Vanta-APK
          path: Vanta.apk
          if-no-files-found: error
